name: Build LiBwrt OpenWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions (true/false)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/LiBwrt-op/openwrt-6.x.git
  REPO_BRANCH: 25.12-nss
  TZ: Asia/Shanghai
  CACHE_TOOLCHAIN: true
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: LiBwrt-OpenWrt

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Free disk space
      uses: sbwml/actions@free-disk
      
    - name: Checkout context
      uses: actions/checkout@v4

    - name: Initialization Environment (Clean Disk)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix libfuse-dev
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source Code & Extract Info
      run: |
        git clone --depth 1 --single-branch -b $REPO_BRANCH $REPO_URL libwrt
        echo "FILE_PATH=$PWD/libwrt" >> $GITHUB_ENV
        
        cd libwrt
        if git log --since="$(date -d 'yesterday 00:00' '+%Y-%m-%dT%H:%M:%S')" --until="$(date -d 'today 00:00' '+%Y-%m-%dT%H:%M:%S')" --pretty=format:"%h %s" --no-merges -- . ':(exclude)scripts/feeds' | grep -q .; then
          VERSION_LOG=$(git log --since="$(date -d 'yesterday 00:00' '+%Y-%m-%dT%H:%M:%S')" --until="$(date -d 'today 00:00' '+%Y-%m-%dT%H:%M:%S')" --pretty=format:"%h %s" --no-merges -- . ':(exclude)scripts/feeds')
          VERSION_LOG="${VERSION_LOG//'%'/'%25'}"
          VERSION_LOG="${VERSION_LOG//$'\n'/'%0A'}"
          VERSION_LOG="${VERSION_LOG//$'\r'/'%0D'}"
          echo "VERSION_LOG=$VERSION_LOG" >> $GITHUB_ENV
        else
          echo "VERSION_LOG=暂无更新" >> $GITHUB_ENV
        fi

    # =============================================
    # 纯 AP（Dumb AP）模式
    # - 取消 VLAN 233：所有网口桥接到同一个 br-lan
    # - 管理 IP: 192.168.2.253
    # - 关闭 DHCP / odhcpd / 防火墙，地址由上游路由器分配
    # - 预置无线：2.4G = NETGEAR，5G = PDCN
    # =============================================
    - name: Configure AP mode
      working-directory: ${{ env.FILE_PATH }}
      run: |
        mkdir -p package/base-files/files/etc/config
        cat > package/base-files/files/etc/config/network << 'EOF'
        config interface 'loopback'
            option device 'lo'
            option proto 'static'
            option ipaddr '127.0.0.1'
            option netmask '255.0.0.0'

        config device
            option name 'br-lan'
            option type 'bridge'
            list ports 'lan1'
            list ports 'lan2'
            list ports 'lan3'
            list ports 'wan'

        config interface 'lan'
            option device 'br-lan'
            option proto 'static'
            option ipaddr '192.168.2.253'
            option netmask '255.255.255.0'
            option gateway '192.168.2.254'
            option dns '192.168.2.254'
        EOF

        mkdir -p package/base-files/files/etc/uci-defaults
        cat > package/base-files/files/etc/uci-defaults/99-ap-mode << 'EOF'
        #!/bin/sh
        # 纯 AP 模式：关闭 DHCP / RA / 防火墙，预置无线
        exec >>/tmp/ap-mode.log 2>&1
        echo "=== ap-mode $(date) ==="

        uci set dhcp.lan.ignore='1'
        uci -q delete dhcp.lan.dhcpv6
        uci -q delete dhcp.lan.ra
        uci commit dhcp

        /etc/init.d/odhcpd disable
        /etc/init.d/firewall disable

        [ -s /etc/config/wireless ] || wifi config 2>/dev/null
        if [ -s /etc/config/wireless ]; then
          for dev in $(uci show wireless 2>/dev/null | sed -n "s/^wireless\.\(radio[0-9]*\)=wifi-device$/\1/p"); do
            band=$(uci -q get wireless.$dev.band)
            case "$band" in
              2g) ssid='NETGEAR' ;;
              5g) ssid='PDCN' ;;
              *) continue ;;
            esac
            uci set wireless.$dev.disabled='0'
            for sec in $(uci show wireless 2>/dev/null | sed -n "s/^wireless\.\([^.]*\)=wifi-iface$/\1/p"); do
              [ "$(uci -q get wireless.$sec.device)" = "$dev" ] || continue
              uci set wireless.$sec.ssid="$ssid"
              uci set wireless.$sec.encryption='psk2'
              uci set wireless.$sec.key='999...zzz'
              uci set wireless.$sec.network='lan'
              uci set wireless.$sec.disabled='0'
            done
          done
          uci commit wireless
        fi

        exit 0
        EOF
        chmod +x package/base-files/files/etc/uci-defaults/99-ap-mode
        echo "AP mode: single bridge br-lan / 192.168.2.253 / DHCP+firewall off / WiFi NETGEAR+PDCN"

    # ===== 先复制 .config（在 feeds 更新之前） =====
    - name: Check Configuration
      id: check_config
      working-directory: ${{ env.FILE_PATH }}
      run: |
        if [ -e $GITHUB_WORKSPACE/.config ]; then
          echo "Found custom .config in workspace."
          cp $GITHUB_WORKSPACE/.config ./.config
          echo "config_exists=true" >> $GITHUB_ENV
        else
          echo "No custom .config found."
          echo "config_exists=false" >> $GITHUB_ENV
        fi

    - name: Update & Install Feeds
      working-directory: ${{ env.FILE_PATH }}
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ===== 强制锁定设备 + 验证 =====
    - name: Validate & Lock Device
      working-directory: ${{ env.FILE_PATH }}
      run: |
        # 只保留目标设备
        # 注意：25.12 不能关掉 CONFIG_TARGET_MULTI_PROFILE，否则 defconfig 会把
        # CONFIG_TARGET_DEVICE_* 全部丢弃（之前就是这样导致本步骤失败）
        sed -i '/CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_/d' .config
        sed -i '/CONFIG_TARGET_DEVICE_qualcommax_ipq807x_DEVICE_/d' .config
        echo 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' >> .config

        # 运行 defconfig 补全依赖
        make defconfig

        # 提取设备信息
        DEVICE_TARGET=$(grep -m1 '^CONFIG_TARGET_BOARD=' .config | awk -F '"' '{print $2}') || true
        DEVICE_SUBTARGET=$(grep -m1 '^CONFIG_TARGET_SUBTARGET=' .config | awk -F '"' '{print $2}') || true
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

        # 打印选中的设备（用于调试，允许为空不报错）
        echo "=== Selected Device ==="
        grep -E '^CONFIG_TARGET_(DEVICE_|MULTI_PROFILE|PER_DEVICE_ROOTFS)' .config | grep '=y' || true
        echo "======================="

        # 硬校验：目标设备必须存在
        if ! grep -q '^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' .config; then
          echo "ERROR: 目标设备 jdcloud_re-ss-01 未出现在 .config 中"
          exit 1
        fi

    - name: Cache Toolchain
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.FILE_PATH }}

    - name: Download Libraries
      working-directory: ${{ env.FILE_PATH }}
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      working-directory: ${{ env.FILE_PATH }}
      run: |
        set -o pipefail
        echo "Starting build..."
        make -j$(nproc) 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Show build log tail on failure
      if: failure()
      working-directory: ${{ env.FILE_PATH }}
      run: |
        echo "===== last 200 lines of build.log ====="
        tail -n 200 build.log || echo "build.log missing"

    - name: Organize Files & Parse Manifest
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd ${{ env.FILE_PATH }}/bin/targets/*/*
        rm -rf packages
        cp ${{ env.FILE_PATH }}/.config ./build.config
        
        manifest_file=$(find . -maxdepth 1 -type f \( -name "*.manifest" -o -name "*.manifest.txt" \) | head -n 1)
        if [ -f "$manifest_file" ]; then
          echo "Found manifest file: $manifest_file"
          kernel_ver=$(grep -m 1 "^kernel - " "$manifest_file" | awk -F ' - ' '{print $2}')
          echo "KERNEL_VER=$kernel_ver" >> $GITHUB_ENV
          luci_ver=$(grep -m 1 "^luci - " "$manifest_file" | awk -F ' - ' '{print $2}')
          echo "LUCI_VER=$luci_ver" >> $GITHUB_ENV
          base_ver=$(grep -m 1 "^base-files - " "$manifest_file" | awk -F ' - ' '{print $2}')
          echo "BASE_VER=$base_ver" >> $GITHUB_ENV
        else
          echo "Manifest file not found!"
          echo "KERNEL_VER=Unknown" >> $GITHUB_ENV
          echo "LUCI_VER=Unknown" >> $GITHUB_ENV
        fi
        
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware Directory (Artifact)
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.DEVICE_TARGET }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release
      if: steps.organize.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true' && !cancelled()
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.FILE_DATE }} ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **This is OpenWrt Firmware for ${{ env.DEVICE_TARGET }} / ${{ env.DEVICE_SUBTARGET }}**
          ### 📒 固件信息
          - 编译时间: ${{ env.DATE }}
          - 平台架构: ${{ env.DEVICE_TARGET }} - ${{ env.DEVICE_SUBTARGET }}
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 💝 源码分支: ${{ env.REPO_BRANCH }}
          - 🌐 管理地址: **192.168.2.253**（纯 AP，DHCP/防火墙已关闭）
          - 📶 无线: 2.4G `NETGEAR` / 5G `PDCN`（WPA2）
          - 🔑 默认密码: 无 (首次登录请立即设置)
          - 📦 包含插件: Argon主题, DiskMan, FileManager, ZeroTier, SoftEtherVPN
          ### 🧊 版本详情 (From Manifest)
          - **Kernel**: ${{ env.KERNEL_VER }}
          - **LuCI**: ${{ env.LUCI_VER }}
          - **Base**: ${{ env.BASE_VER }}
          ### 🔄 源码更新日志 (最近24小时)
          ${{ env.VERSION_LOG }}
